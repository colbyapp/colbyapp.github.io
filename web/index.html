<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Colby</title>
  <meta name="description" content="Monitor Combustion thermometers from your computer.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="src/ui/main.js"></script>
</head>
<body>
  <div id="alert-band" class="alert-band" role="alert" aria-live="assertive" hidden></div>
  <div id="reconnect-band" class="reconnect-band" popover="manual" role="status" aria-live="polite" hidden></div>

  <header class="toolbar">
    <div class="brand"><img class="brand-icon" src="logo.svg" alt="" width="32" height="32">Colby</div>
    <div class="spacer"></div>
    <button class="tool" id="alerts-button" aria-label="Active alerts" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="alert-count"></span></button>
    <button class="tool" id="history-button">History</button>
    <button class="tool" id="devices-button">Devices</button>
    <button class="tool" id="kitchen-button">Kitchen mode</button>
    <button class="tool icon" id="settings-button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <main id="main">
    <section id="empty" class="empty" hidden></section>
    <section id="probe-view" class="probe-view" hidden>
      <div class="content">
        <div class="probe-header">
          <div>
            <div class="title-row"><span id="badge" class="badge"></span><h1 id="probe-name"></h1></div>
            <div id="probe-caption" class="caption"></div>
          </div>
          <div class="ready-block">
            <div id="ready-label" class="caption"></div>
            <div><span id="ready-primary" class="countdown"></span><span id="ready-secondary" class="secondary-time"></span></div>
          </div>
        </div>
        <div class="readouts" id="readouts"></div>
        <div class="graph-card">
          <div class="graph-label"><div id="graph-state"></div><div id="graph-time" class="graph-time"></div></div>
          <div class="graph-area"><canvas id="graph" tabindex="0" aria-label="Temperature graph. Use left and right arrows to inspect values."></canvas></div>
          <div id="graph-empty" class="graph-empty" hidden></div>
        </div>
        <div id="chips" class="chips"></div>
      </div>
      <aside class="inspector" id="inspector"></aside>
    </section>
  </main>

  <div id="kitchen" class="kitchen" hidden></div>
  <div id="onboarding" class="onboarding" hidden></div>

  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
