name: web

# Tests and builds web/ on every change. Deploys web/dist to GitHub Pages only from a `web-vX.Y.Z` tag, or from
# "Run workflow" (any branch or tag). Merging to main does not deploy. Release steps: web/README.md → "Ship a release".
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions", and allow `web-v*` tags under
# Settings → Environments → github-pages.

on:
  push:
    branches: ["**"]
    tags: ["web-v*"] # GitHub skips the paths filter for tag pushes, so a tag always runs
    paths: ["web/**", "spec/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "spec/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a release tag: GitHub's generated release notes (the same text `gh release create --generate-notes` writes), for
  # Settings → "What's new". A separate job because the notes API needs contents: write (it writes nothing); the build job
  # runs npm and keeps a read-only token.
  notes:
    if: startsWith(github.ref, 'refs/tags/web-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --match 'web-v*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          args=(-f tag_name="$GITHUB_REF_NAME")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          echo "notes for $GITHUB_REF_NAME since ${prev:-the first commit}"
          body=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body)
          echo "$body"
          echo "body=$(printf '%s' "$body" | base64 -w0)" >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    if: ${{ !cancelled() && needs.notes.result != 'failure' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          COLBY_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/web-v') && github.ref_name || '' }}
          COLBY_RELEASE_NOTES_B64: ${{ needs.notes.outputs.body }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    # The explicit result check: the skipped notes job (non-tag runs) would otherwise skip this job too.
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web-v'))) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
