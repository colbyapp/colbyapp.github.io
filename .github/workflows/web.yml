name: web

# Tests and builds web/ on every change. Deploys web/dist to GitHub Pages only from a `web-vX.Y.Z` tag, or from
# "Run workflow" (any branch or tag). Merging to main does not deploy. Release steps: web/README.md → "Ship a release".
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions", and allow `web-v*` tags under
# Settings → Environments → github-pages.

on:
  push:
    branches: ["**"]
    tags: ["web-v*"] # GitHub skips the paths filter for tag pushes, so a tag always runs
    paths: ["web/**", "spec/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "spec/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web-v'))
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
